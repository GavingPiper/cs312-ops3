name: Build and Push to ECR

on:
  push:
    tags:
      - 'v*'


env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: cs312-minecraft-ecr

jobs:
  build-test-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Smoke Test
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: 1.21.1  # Note: Use the version that matches your Java!
        run: |
          # 1. Build
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          
          # 2. Smoke Test: Start the container
          docker run -d --name smoke-test -e EULA=TRUE $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          
          # 3. Wait and Check: Give it time to attempt a startup
          sleep 30
          if [ "$(docker inspect -f '{{.State.Running}}' smoke-test)" == "false" ]; then
            echo "SMOKE TEST FAILED: Container crashed on startup!"
            docker logs smoke-test
            exit 1
          fi
          
          echo "SMOKE TEST PASSED: Container is stable."
          docker stop smoke-test && docker rm smoke-test

      - name: Build, tag, and push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: 1.21.1
        run: |
          # Build the image
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          
          # Push the image to ECR
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
